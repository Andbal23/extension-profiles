<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a18"/>
      <stop offset="50%" stop-color="#0b1124"/>
      <stop offset="100%" stop-color="#081520"/>
    </linearGradient>
    <radialGradient id="blob1" cx="16%" cy="22%" r="56%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="84%" cy="76%" r="58%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="55%" cy="12%" r="44%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.065"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2347"/>
      <stop offset="55%" stop-color="#111938"/>
      <stop offset="100%" stop-color="#0b2f38"/>
    </linearGradient>
    <linearGradient id="layerCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="320" rx="22" fill="url(#bgGrad)"/>
  <rect width="900" height="320" rx="22" fill="url(#grid)"/>
  <rect width="900" height="320" rx="22" fill="url(#blob1)"/>
  <rect width="900" height="320" rx="22" fill="url(#blob2)"/>
  <rect width="900" height="320" rx="22" fill="url(#blob3)"/>
  <rect x="1" y="1" width="898" height="318" rx="21" fill="none" stroke="url(#glassBorder)" stroke-width="1.5"/>

  <!-- Left Column: Logo + Brand Title -->
  <g transform="translate(46, 54)">
    <!-- Mini Layered Profiles Logo (72x72) -->
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#logoBg)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>
    <rect x="23" y="16" width="32" height="32" rx="8" fill="#818cf8" fill-opacity="0.32" stroke="#a5b4fc" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="18" y="21" width="32" height="32" rx="8" fill="#38bdf8" fill-opacity="0.38" stroke="#7dd3fc" stroke-opacity="0.7" stroke-width="1.2"/>
    <rect x="13" y="26" width="34" height="32" rx="8" fill="#0f172a" stroke="url(#layerCyan)" stroke-width="2"/>
    <!-- Puzzle notch silhouette inside front card -->
    <path d="M 23 39 H 27.5 A 3 3 0 1 1 32.5 39 H 37 V 49 H 23 Z" fill="url(#layerCyan)"/>

    <text x="90" y="33" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="30" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Extension Profiles</text>
    <text x="90" y="60" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14.5" fill="#94a3b8">Switch GNOME extension presets in one click or shortcut</text>
  </g>

  <!-- Highlights -->
  <g transform="translate(48, 152)" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13.5" fill="#cbd5e1">
    <circle cx="6" cy="7" r="4" fill="#38bdf8"/>
    <text x="20" y="12">Top bar selector + <tspan font-weight="700" fill="#f1f5f9">Super + E</tspan> instant profile cycling</text>

    <circle cx="6" cy="36" r="4" fill="#34d399"/>
    <text x="20" y="41">Drag &amp; drop order, Always-Enabled whitelist &amp; system sync</text>

    <circle cx="6" cy="65" r="4" fill="#a78bfa"/>
    <text x="20" y="70">JSON Backup/Restore, startup rules &amp; compatibility indicator</text>
  </g>

  <!-- Bottom Pill Badges -->
  <g transform="translate(46, 252)" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="700">
    <rect x="0" y="0" width="114" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="57" y="18.5" text-anchor="middle" fill="#7dd3fc">GNOME 45 &#x2013; 51</text>

    <rect x="124" y="0" width="96" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="172" y="18.5" text-anchor="middle" fill="#6ee7b7">Version 2</text>

    <rect x="230" y="0" width="92" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.45"/>
    <text x="276" y="18.5" text-anchor="middle" fill="#c4b5fd">GPL-3.0</text>
  </g>

  <!-- Right Column: Glassmorphic Top-Bar & Profile Switcher Preview -->
  <g transform="translate(534, 34)">
    <rect x="0" y="0" width="320" height="252" rx="20" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.2"/>

    <!-- Simulated Top Bar Pill -->
    <rect x="18" y="16" width="284" height="32" rx="12" fill="#090d16" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="30" y="28" width="16" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="108" y="20" width="104" height="24" rx="12" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="123" cy="32" r="4.5" fill="#38bdf8"/>
    <text x="135" y="36" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Work</text>
    <circle cx="282" cy="32" r="3" fill="#64748b"/>
    <circle cx="270" cy="32" r="3" fill="#64748b"/>

    <!-- Active Profile Row -->
    <g transform="translate(18, 60)">
      <rect x="0" y="0" width="284" height="40" rx="12" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.48"/>
      <circle cx="20" cy="20" r="4.5" fill="#38bdf8"/>
      <text x="36" y="24.5" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">Work</text>
      <rect x="200" y="10" width="70" height="20" rx="10" fill="#34d399" fill-opacity="0.20"/>
      <text x="235" y="23.5" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="10.5" font-weight="700" fill="#6ee7b7">Active</text>
    </g>

    <!-- Other Profiles -->
    <g transform="translate(18, 108)" font-family="Noto Sans, DejaVu Sans, sans-serif">
      <rect x="0" y="0" width="284" height="36" rx="10" fill="#ffffff" fill-opacity="0.05"/>
      <text x="36" y="22.5" font-size="13" fill="#e2e8f0">Gaming</text>
      <text x="268" y="22" text-anchor="end" font-size="11" fill="#64748b">2 extensions</text>

      <rect x="0" y="42" width="284" height="36" rx="10" fill="#ffffff" fill-opacity="0.04"/>
      <text x="36" y="64.5" font-size="13" fill="#e2e8f0">Presentation</text>
      <text x="268" y="64" text-anchor="end" font-size="11" fill="#64748b">3 extensions</text>

      <rect x="0" y="84" width="284" height="36" rx="10" fill="#ffffff" fill-opacity="0.03"/>
      <text x="36" y="106.5" font-size="13" fill="#94a3b8">Minimal</text>
      <rect x="206" y="92" width="66" height="20" rx="10" fill="#f59e0b" fill-opacity="0.16"/>
      <text x="239" y="105.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fcd34d">Whitelist</text>
    </g>

    <text x="160" y="242" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="11" fill="#64748b">Cycle presets seamlessly &#x2022; Preserves pinned extensions</text>
  </g>
</svg>
