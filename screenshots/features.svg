<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a18"/>
      <stop offset="50%" stop-color="#0b1124"/>
      <stop offset="100%" stop-color="#081520"/>
    </linearGradient>
    <radialGradient id="fglow1" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fglow2" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" rx="22" fill="url(#fbg)"/>
  <rect width="900" height="420" rx="22" fill="url(#fglow1)"/>
  <rect width="900" height="420" rx="22" fill="url(#fglow2)"/>
  <rect x="1" y="1" width="898" height="418" rx="21" fill="none" stroke="url(#cardStroke)" stroke-width="1.4"/>

  <!-- Card 1: Top Bar Selector -->
  <g transform="translate(28, 26)">
    <rect width="268" height="174" rx="18" fill="url(#cardBg)" stroke="url(#cardStroke)"/>
    <rect x="20" y="20" width="42" height="42" rx="12" fill="#0ea5e9" fill-opacity="0.18" stroke="#0ea5e9" stroke-opacity="0.45"/>
    <rect x="30" y="34" width="22" height="14" rx="4" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="34" y1="41" x2="48" y2="41" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <text x="20" y="92" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Top Bar Indicator</text>
    <text x="20" y="116" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">Switch presets from the panel</text>
    <text x="20" y="135" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">with Icon, Icon + Text, Text,</text>
    <text x="20" y="154" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">or Hidden stealth mode.</text>
  </g>

  <!-- Card 2: Keyboard Shortcut -->
  <g transform="translate(316, 26)">
    <rect width="268" height="174" rx="18" fill="url(#cardBg)" stroke="url(#cardStroke)"/>
    <rect x="20" y="20" width="42" height="42" rx="12" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.45"/>
    <rect x="30" y="33" width="22" height="16" rx="3.5" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    <line x1="34" y1="39" x2="38" y2="39" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="39" x2="48" y2="39" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="44" x2="46" y2="44" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <text x="20" y="92" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Quick Cycle Hotkey</text>
    <text x="20" y="116" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">Rotate cleanly through your</text>
    <text x="20" y="135" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">profiles via Super+E or any</text>
    <text x="20" y="154" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">custom keybinding you choose.</text>
  </g>

  <!-- Card 3: Drag & Drop Ordering -->
  <g transform="translate(604, 26)">
    <rect width="268" height="174" rx="18" fill="url(#cardBg)" stroke="url(#cardStroke)"/>
    <rect x="20" y="20" width="42" height="42" rx="12" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.45"/>
    <line x1="33" y1="36" x2="49" y2="36" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="41" x2="49" y2="41" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="46" x2="49" y2="46" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
    <text x="20" y="92" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Drag &amp; Drop Ordering</text>
    <text x="20" y="116" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">Reorder profiles with drag handles</text>
    <text x="20" y="135" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">or Up/Down buttons to organize</text>
    <text x="20" y="154" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">both menu and hotkey rotation.</text>
  </g>

  <!-- Card 4: Always Enabled Whitelist -->
  <g transform="translate(28, 220)">
    <rect width="268" height="174" rx="18" fill="url(#cardBg)" stroke="url(#cardStroke)"/>
    <rect x="20" y="20" width="42" height="42" rx="12" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-opacity="0.45"/>
    <path d="M 41 31 L 49 34.5 V 41 C 49 46 45.5 49.5 41 51 C 36.5 49.5 33 46 33 41 V 34.5 Z" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linejoin="round"/>
    <text x="20" y="92" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Always-Enabled Whitelist</text>
    <text x="20" y="116" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">Pin essential extensions so they</text>
    <text x="20" y="135" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">stay running across every switch,</text>
    <text x="20" y="154" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">without modifying any profile.</text>
  </g>

  <!-- Card 5: Compatibility Guard -->
  <g transform="translate(316, 220)">
    <rect width="268" height="174" rx="18" fill="url(#cardBg)" stroke="url(#cardStroke)"/>
    <rect x="20" y="20" width="42" height="42" rx="12" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-opacity="0.45"/>
    <circle cx="41" cy="41" r="9" fill="none" stroke="#fda4af" stroke-width="2"/>
    <path d="M 41 36.5 V 41 L 44 43" fill="none" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
    <text x="20" y="92" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Compatibility Indicator</text>
    <text x="20" y="116" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">Highlights outdated or unsupported</text>
    <text x="20" y="135" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">extensions directly in the list</text>
    <text x="20" y="154" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">so broken toggles stand out fast.</text>
  </g>

  <!-- Card 6: Backup, Sync & Startup -->
  <g transform="translate(604, 220)">
    <rect width="268" height="174" rx="18" fill="url(#cardBg)" stroke="url(#cardStroke)"/>
    <rect x="20" y="20" width="42" height="42" rx="12" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-opacity="0.45"/>
    <path d="M 35 37 H 47 M 44 34 L 47 37 L 44 40 M 47 45 H 35 M 38 42 L 35 45 L 38 48" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="92" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Backup, Sync &amp; Startup</text>
    <text x="20" y="116" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">JSON Export/Import, live Sync</text>
    <text x="20" y="135" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">from System, and restore last or</text>
    <text x="20" y="154" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="12.5" fill="#94a3b8">default profile at login (45&#x2013;51).</text>
  </g>
</svg>
